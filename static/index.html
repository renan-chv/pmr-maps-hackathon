<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1d4ed8">
  <title>PMR Maps – Île-de-France</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <a class="skip" href="#search">Aller à la recherche</a>
  <div id="map" role="application" aria-label="Carte de l'accessibilité en fauteuil roulant"></div>

  <!-- Filters over the map -->
  <div id="chips" role="toolbar" aria-label="Afficher sur la carte">
    <button class="chip on" data-layer="lifts" aria-pressed="true"><span class="ic">⇅</span>Ascenseurs</button>
    <button class="chip on" data-layer="works" aria-pressed="true"><span class="ic">🚧</span>Travaux</button>
    <button class="chip" data-layer="quais" aria-pressed="false"><span class="ic">🚇</span>Quais</button>
    <button class="chip" data-layer="bus" aria-pressed="false"><span class="ic">🚌</span>Bus</button>
    <button class="chip" data-layer="places" aria-pressed="false"><span class="ic">♿</span>Restos, commerces</button>
    <span id="place-filters" class="sub-chips" hidden>
      <button class="chip sub" data-filter="food" aria-pressed="false">Restos, cafés</button>
      <button class="chip sub" data-filter="ok" aria-pressed="false">Entrée accessible</button>
      <button class="chip sub" data-filter="wc" aria-pressed="false">Toilettes adaptées</button>
    </span>
  </div>

  <div id="map-tools">
    <button id="locate" class="round" aria-label="Me localiser" title="Me localiser">◎</button>
    <button id="textsize" class="round" aria-label="Agrandir le texte" title="Agrandir le texte">A+</button>
  </div>

  <main id="sheet" aria-label="Panneau">
    <button id="grip" aria-label="Agrandir ou réduire le panneau"><span></span></button>

    <!-- VIEW: home -->
    <section class="view" id="v-home" aria-labelledby="h-home">
      <h1 id="h-home" class="brand">PMR Maps <small>en fauteuil, en Île-de-France</small></h1>

      <div class="search" role="search">
        <label for="search" class="sr">Où voulez-vous aller ?</label>
        <span class="search-ic" aria-hidden="true">🔍</span>
        <input id="search" type="search" placeholder="Où voulez-vous aller ?" autocomplete="off"
               role="combobox" aria-expanded="false" aria-controls="suggest" aria-autocomplete="list">
        <button id="mic" class="mic" aria-label="Dicter">🎤</button>
      </div>
      <ul id="suggest" class="suggest" role="listbox" aria-label="Suggestions" hidden></ul>

      <div id="today" class="today" aria-live="polite">
        <div class="today-skel">Chargement de l'état des ascenseurs…</div>
      </div>

      <button id="nearby" class="big-btn">📍 Gares accessibles autour de moi</button>
      <div id="nearby-list"></div>

      <h2 class="section-title">Dernières alertes</h2>
      <ul id="alerts" class="alerts" aria-live="polite"></ul>

      <details class="sources">
        <summary>D'où viennent les données ?</summary>
        <ul id="sources-list"></ul>
      </details>
    </section>

    <!-- VIEW: detail (station or place) -->
    <section class="view" id="v-detail" hidden aria-labelledby="d-title">
      <button class="back" data-back>‹ Retour</button>
      <div id="detail"></div>
    </section>

    <!-- VIEW: journey -->
    <section class="view" id="v-trip" hidden aria-labelledby="t-title">
      <button class="back" data-back>‹ Retour</button>
      <h2 id="t-title" class="title">Itinéraire en fauteuil</h2>
      <div class="trip-fields">
        <div class="trip-row"><span class="pin a" aria-hidden="true">A</span>
          <label for="trip-from" class="sr">Départ</label>
          <input id="trip-from" class="field" type="search" placeholder="Départ" autocomplete="off"></div>
        <ul id="suggest-from" class="suggest" role="listbox" aria-label="Suggestions départ" hidden></ul>
        <div class="trip-row"><span class="pin b" aria-hidden="true">B</span>
          <label for="trip-to" class="sr">Arrivée</label>
          <input id="trip-to" class="field" type="search" placeholder="Arrivée" autocomplete="off"></div>
        <ul id="suggest-to" class="suggest" role="listbox" aria-label="Suggestions arrivée" hidden></ul>
        <button id="trip-go" class="big-btn primary">Vérifier le trajet</button>
      </div>
      <div id="trip-result" aria-live="polite"></div>
    </section>
  </main>

  <div id="toast" role="status" aria-live="polite" hidden></div>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
